<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Charmander Finanzas</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Charmander">
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/charmander.png">

    <style>
        :root {
            --primary: #FF7F27; /* Naranja Charmander */
            --primary-dark: #E65C00;
            --accent: #FFCC00; /* Amarillo flama */
            --bg: #121212;
            --surface: #1E1E1E;
            --text: #FFFFFF;
            --text-secondary: #AAAAAA;
            --income-sueldo: #4CAF50; /* Verde */
            --income-cueva: #00BCD4;  /* Azul La Cueva */
            --expense: #F44336;       /* Rojo */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: env(safe-area-inset-top); /* Evita la isla dinámica/notch */
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .app-container {
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* Encabezado con Charmander */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        .charmander-logo {
            width: 60px;
            height: 60px;
            background: var(--surface);
            border-radius: 50%;
            padding: 5px;
            border: 2px solid var(--primary);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tarjeta de Balance */
        .balance-card {
            background: linear-gradient(135deg, var(--surface) 0%, #2a1b10 100%);
            border: 1px solid rgba(255, 127, 39, 0.2);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .balance-card h3 {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
        }

        /* Tabs de 3 opciones fijas */
        .tabs {
            display: flex;
            background: var(--surface);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 12px 5px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active[data-mode="sueldo"] {
            background: var(--income-sueldo);
            color: white;
        }

        .tab-btn.active[data-mode="cueva"] {
            background: var(--income-cueva);
            color: white;
        }

        .tab-btn.active[data-mode="gasto"] {
            background: var(--expense);
            color: white;
        }

        /* Formulario */
        .form-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            background: #2D2D2D;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 127, 39, 0.3);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Historial */
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-secondary);
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction-item {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trans-info p {
            font-weight: 600;
        }

        .trans-info span {
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .trans-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
        }

        .trans-amount {
            font-weight: 700;
        }

        .trans-amount.sueldo { color: var(--income-sueldo); }
        .trans-amount.cueva { color: var(--income-cueva); }
        .trans-amount.gasto { color: var(--expense); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <svg class="charmander-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 24 C16 12, 48 12, 48 24 C48 36, 44 48, 40 52 C36 56, 28 56, 24 52 C20 48, 16 36, 16 24 Z" fill="#FF7F27"/>
                <path d="M24 32 C24 24, 40 24, 40 32 C40 42, 36 52, 32 52 C28 52, 24 42, 24 32 Z" fill="#FFCC00"/>
                <circle cx="26" cy="22" r="3" fill="#121212"/>
                <circle cx="26" cy="21" r="1" fill="#FFFFFF"/>
                <circle cx="38" cy="22" r="3" fill="#121212"/>
                <circle cx="38" cy="21" r="1" fill="#FFFFFF"/>
                <path d="M20 26 Q22 28 24 26" stroke="#E65C00" stroke-width="2" fill="none"/>
                <path d="M40 26 Q42 28 44 26" stroke="#E65C00" stroke-width="2" fill="none"/>
                <path d="M42 46 Q54 44 52 32 Q46 36 44 44" fill="#FF3300"/>
                <path d="M44 44 Q50 42 48 36 Q45 38 44 42" fill="#FFCC00"/>
            </svg>
            <h1>Charmander Finanzas</h1>
        </div>

        <div class="balance-card">
            <h3>Balance Disponible</h3>
            <div class="balance-amount" id="totalBalance">$0.00</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btnSueldo" data-mode="sueldo" onclick="setMode('sueldo')">Sueldo</button>
            <button class="tab-btn" id="btnCueva" data-mode="cueva" onclick="setMode('cueva')">La Cueva</button>
            <button class="tab-btn" id="btnGasto" data-mode="gasto" onclick="setMode('gasto')">Gastos</button>
        </div>

        <div class="form-section">
            <div class="input-group">
                <label id="labelConcepto">Concepto (Sueldo)</label>
                <input type="text" id="concepto" placeholder="Ej. Quincena, Bono, Venta, etc.">
            </div>
            <div class="input-group">
                <label>Monto ($)</label>
                <input type="number" id="monto" inputmode="decimal" placeholder="0.00">
            </div>
            <button class="submit-btn" id="btnRegistrar" onclick="agregarMovimiento()">Registrar Sueldo</button>
        </div>

        <div class="history-section">
            <h2>Historial de Movimientos</h2>
            <div class="transaction-list" id="listaMovimientos"></div>
        </div>
    </div>

    <script>
        let currentMode = 'sueldo';
        let movimientos = JSON.parse(localStorage.getItem('charmander_movs')) || [];

        function setMode(mode) {
            currentMode = mode;
            
            document.getElementById('btnSueldo').classList.toggle('active', mode === 'sueldo');
            document.getElementById('btnCueva').classList.toggle('active', mode === 'cueva');
            document.getElementById('btnGasto').classList.toggle('active', mode === 'gasto');
            
            const label = document.getElementById('labelConcepto');
            const btn = document.getElementById('btnRegistrar');
            
            if (mode === 'sueldo') {
                label.innerText = 'Concepto (Sueldo)';
                btn.innerText = 'Registrar Sueldo';
                btn.style.background = 'var(--income-sueldo)';
            } else if (mode === 'cueva') {
                label.innerText = 'Concepto (La Cueva)';
                btn.innerText = 'Registrar Ingreso Bar';
                btn.style.background = 'var(--income-cueva)';
            } else {
                label.innerText = 'Concepto del Gasto';
                btn.innerText = 'Registrar Gasto';
                btn.style.background = 'var(--expense)';
            }
        }

        function actualizarUI() {
            const lista = document.getElementById('listaMovimientos');
            lista.innerHTML = '';
            let balance = 0;

            movimientos.forEach(mov => {
                if (mov.tipo === 'sueldo' || mov.tipo === 'cueva') {
                    balance += mov.monto;
                } else {
                    balance -= mov.monto;
                }

                let tagTxt = mov.tipo === 'sueldo' ? 'Sueldo' : mov.tipo === 'cueva' ? 'La Cueva' : 'Gasto';

                const item = document.createElement('div');
                item.className = 'transaction-item';
                item.innerHTML = `
                    <div class="trans-info">
                        <p>${mov.concepto} <span>${tagTxt}</span></p>
                        <span class="trans-date">${mov.fecha}</span>
                    </div>
                    <div class="trans-amount ${mov.tipo}">
                        ${(mov.tipo === 'sueldo' || mov.tipo === 'cueva') ? '+' : '-'}$${mov.monto.toFixed(2)}
                    </div>
                `;
                lista.appendChild(item);
            });

            document.getElementById('totalBalance').innerText = `$${balance.toFixed(2)}`;
            localStorage.setItem('charmander_movs', JSON.stringify(movimientos));
        }

        function agregarMovimiento() {
            const concepto = document.getElementById('concepto').value.trim();
            const monto = parseFloat(document.getElementById('monto').value);

            if (!concepto || isNaN(monto) || monto <= 0) {
                alert('Mete un concepto y un monto válido, mi estimado.');
                return;
            }

            const nuevoMov = {
                id: Date.now(),
                concepto: concepto,
                monto: monto,
                tipo: currentMode,
                fecha: new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' })
            };

            movimientos.unshift(nuevoMov);
            actualizarUI();

            document.getElementById('concepto').value = '';
            document.getElementById('monto').value = '';
        }

        setMode('sueldo');
        actualizarUI();
    </script>
</body>
</html>
